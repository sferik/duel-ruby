name: duel-activerecord

# duel-activerecord, a gem of its own in plugins/activerecord: its
# tests, lint, types, mutation testing and benchmarks. They run only
# when something in it changes, or this workflow does. Nightly, only
# its benchmarks run, against its last release, and its tests on
# TruffleRuby (the slowest). Run by hand (Actions > duel-activerecord >
# Run workflow), mutant mutates every subject and Duel compares anyway.
on:
  push:
    branches: [main]
    paths:
      - "plugins/activerecord/**"
      - ".github/workflows/plugin-activerecord.yml"
  pull_request:
    paths:
      - "plugins/activerecord/**"
      - ".github/workflows/plugin-activerecord.yml"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The plugin is a project of its own, in its directory: its Gemfile (and
# ruby/setup-ruby's bundler-cache, given working-directory), Rakefile,
# tests and benchmarks.
defaults:
  run:
    working-directory: plugins/activerecord

jobs:
  test:
    name: Test on ${{ matrix.ruby-version }}, Active Record ${{ matrix.activerecord }}
    runs-on: ubuntu-latest
    # A hang fails the job, rather than running for GitHub's six hours
    timeout-minutes: 20
    # The development versions (Ruby's, JRuby's and TruffleRuby's) get an
    # early look, but can't fail the build.
    strategy:
      fail-fast: false
      matrix:
        # JRuby runs the tests on SQLite through JDBC (it can't build the
        # sqlite3 gem, a C extension), whose adapter holds Active Record
        # to 7.2 there (the plugin itself is plain Ruby).
        # The slowest first, so they start before the rest of the queue
        # TruffleRuby's, the slowest, run nightly (on the schedule), alone:
        # a push or pull request waits for the rest only.
        ruby-version: ${{ fromJSON(github.event_name == 'schedule' && '["truffleruby-head"]' || '["jruby-10.0", "jruby-10.1", "jruby-head", "3.4", "4.0", "ruby-head"]') }}
        activerecord: [">= 7.2"]
        include: ${{ fromJSON(github.event_name == 'schedule' && '[]' || '[{"ruby-version":"3.4","activerecord":"~> 7.2.0"},{"ruby-version":"3.4","activerecord":"~> 8.0.0"}]') }}
    env:
      ACTIVERECORD: ${{ matrix.activerecord }}
    steps:
      - uses: actions/checkout@v7
      - id: ruby
        uses: ruby/setup-ruby@v1
        continue-on-error: ${{ endsWith(matrix.ruby-version, '-head') }}
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          working-directory: plugins/activerecord
      # A development version's failure is advisory: the step's failure
      # shows, but the job (and its check) passes, with a warning.
      - name: Run tests
        id: tests
        continue-on-error: ${{ endsWith(matrix.ruby-version, '-head') }}
        env:
          COVERAGE: "false"
          # JRuby's --dev starts each process faster, and the tests start many
          JRUBY_OPTS: ${{ startsWith(matrix.ruby-version, 'jruby') && '--dev' || '' }}
        run: bundle exec rake test
      - name: Note an advisory failure
        if: steps.ruby.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: echo "::warning title=${{ matrix.ruby-version }} (advisory)::A step failed on ${{ matrix.ruby-version }}, a development version"

  coverage:
    name: Coverage (100% line, branch and method)
    # (Nightly, only the comparison with the last release runs.)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: plugins/activerecord
      # SimpleCov's strict profile fails the run if any criterion drops
      # below 100%.
      - run: bundle exec rake test

  lint:
    name: Lint
    # (Nightly, only the comparison with the last release runs.)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: plugins/activerecord
      - run: bundle exec rubocop
      - run: bundle exec standardrb

  typecheck:
    name: Typecheck on ${{ matrix.ruby-version }}
    # (Nightly, only the comparison with the last release runs.)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Steep runs on CRuby only.
        ruby-version: ["3.4", "4.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          working-directory: plugins/activerecord
      # steep check: lib/ against sig/, strictly. Any diagnostic fails the
      # run.
      - name: Check types
        run: bundle exec rake typecheck

  plan:
    name: Plan the mutation testing
    # (Nightly, only the comparison with the last release runs.)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COVERAGE: "false"
      # Subjects a runner takes, sized so a shard of the slowest stays well
      # inside the timeout below (each mutation reruns the tests that cover
      # its subject).
      SUBJECTS_PER_SHARD: 4
      # A ceiling on the fan-out: past it, shards grow rather than runners.
      MAX_SHARDS: 12
    outputs:
      base: ${{ steps.plan.outputs.base }}
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      # Mutant selects subjects by diffing against a revision, so the
      # revision has to be in the clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: plugins/activerecord
      - name: Fetch the base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin ${{ github.base_ref }}
      # A pull request is diffed against its base branch, and a push against
      # the head it replaced. The first push, a push whose old head is gone,
      # and a manual run mutate every subject (an empty base).
      - name: Plan the shards
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base=$(git rev-parse "origin/${{ github.base_ref }}^{commit}")
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
            git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags origin "$base" 2>/dev/null || base=""
          else
            base=""
          fi
          echo "Comparing against ${base:-nothing: every subject}"

          count=$(bundle exec rake -s "mutant:subjects[$base]" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            total=0
          else
            total=$(( (count + SUBJECTS_PER_SHARD - 1) / SUBJECTS_PER_SHARD ))
            if [ "$total" -gt "$MAX_SHARDS" ]; then total="$MAX_SHARDS"; fi
          fi
          echo "$count subject(s) across $total shard(s)"
          {
            echo "base=$base"
            echo "count=$count"
            echo "total=$total"
            echo "shards=$(jq -nc --argjson n "$total" '[range($n)]')"
          } >> "$GITHUB_OUTPUT"

  # A change that touches no library code selects nothing and never gets
  # here.
  mutate:
    name: Mutation testing, shard ${{ matrix.shard }} (every mutant killed)
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COVERAGE: "false"
      # Subjects a runner takes, sized so a shard of the slowest stays well
      # inside the timeout below (each mutation reruns the tests that cover
      # its subject).
      SUBJECTS_PER_SHARD: 4
      # A ceiling on the fan-out: past it, shards grow rather than runners.
      MAX_SHARDS: 12
    strategy:
      # Every shard reports its own survivors: stopping the others on the
      # first failure would hide the rest.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      # Mutant selects subjects by diffing against a revision, so the
      # revision has to be in the clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: plugins/activerecord
      - name: Make the base revision available
        if: needs.plan.outputs.base != ''
        run: |
          git cat-file -e "${{ needs.plan.outputs.base }}^{commit}" 2>/dev/null ||
            git fetch --no-tags origin "${{ needs.plan.outputs.base }}"
      # mutant.yml says what's mutated and how it's tested. Any mutant left
      # alive fails the shard.
      - name: Mutation-test this shard
        run: bundle exec rake "mutant:shard[${{ needs.plan.outputs.base }},${{ matrix.shard }},${{ needs.plan.outputs.total }}]"

  duel:
    name: Duel
    runs-on: ubuntu-latest
    # The run's status (passed, failed or neutral), for the badge.
    outputs:
      status: ${{ steps.compare.outputs.status }}
    # Duel runs in the plugin's directory (the default above), and checks
    # out the whole repository for the baseline, using its
    # plugins/activerecord too.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the baseline comes from history, tags included
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: plugins/activerecord
      # Against the main branch for a pull request, what was there before
      # for a push, and the last release on a schedule (slow creep).
      - name: Compare
        id: compare
        env:
          DUEL_BASE: ${{ github.event_name == 'schedule' && 'last-release' || github.event_name == 'push' && github.event.before || '' }}
          # (Run by hand, it compares anyway: with nothing changed, the code
          # with itself, which checks the setup.)
          DUEL_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          # (A branch's first push, or one that rewrote history, has no
          # commit before it here to compare against.)
          if [ "$GITHUB_EVENT_NAME" = push ] && ! git cat-file -e "$DUEL_BASE^{commit}" 2>/dev/null; then
            echo "::notice::No commit before this push to compare against"
            exit 0
          fi
          bundle exec duel

  # Duel's badge, in plugins/activerecord/README.md: green (perf guarded), red (perf
  # regressed) or grey (not measured), as the last push to main that
  # Duel compared left it.
  # This job writes it, alone, to a branch of its own, duel/badge-plugins-activerecord, and
  # checks nothing out (see docs/ci.md, Show whether the last push
  # passed).
  badge:
    name: Update the badge
    needs: duel
    # One at a time, so that one run's check of which push the badge
    # shows can't interleave with another run's write (a push's run
    # doesn't wait for the one before it). A badge job that's running is
    # never cancelled, and one that's waiting gives way to a newer push's,
    # whose result the badge should show anyway.
    concurrency:
      group: ${{ github.workflow }}-badge
      cancel-in-progress: false
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && (needs.duel.result == 'failure' || needs.duel.outputs.status == 'passed' || needs.duel.outputs.status == 'failed') }}
    runs-on: ubuntu-latest
    # (Nothing's checked out, so not in the plugin's directory.)
    defaults:
      run:
        working-directory: .
    permissions:
      contents: write # to move the badge's branch
    steps:
      - name: Update the badge
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: duel/badge-plugins-activerecord
          RESULT: ${{ needs.duel.result }}
          STATUS: ${{ needs.duel.outputs.status }}
        run: |
          # (Git can't make a branch where another's name is a folder of its
          # name: a branch named duel blocks duel/passed/main. If one does,
          # this names it.)
          blocked() {
            prefix=$BRANCH
            while [ "${prefix%/*}" != "$prefix" ]; do
              prefix=${prefix%/*}
              if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$prefix" > /dev/null 2>&1; then
                echo "::error::The branch $prefix keeps Duel from making $BRANCH, as Git can't have both. Delete it (git push origin --delete $prefix), or rename it."
              fi
            done
            exit 1
          }
          # (Where the badge is a newer push's, that push's run has the say.
          # Its commit names the push.)
          last=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .commit.message 2>/dev/null | sed -n 's/^Duel.s badge, for \([0-9a-f]*\)$/\1/p') || true
          if [ -n "$last" ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$last" --jq .status 2>/dev/null)" = ahead ]; then exit 0; fi
          # (Its image, written here rather than fetched from anywhere: green,
          # red where Duel failed the push or found a regression, or grey
          # where the Duel job failed before Duel said either.)
          state="perf guarded" width=133 top="#34D058" bottom="#28A745" right="76.939C78.629 0 80 1.343 80"
          if [ "$STATUS" = failed ]; then
            state="perf regressed" width=142 top="#EA4A5A" bottom="#D73A49" right="85.939C87.629 0 89 1.343 89"
          elif [ "$RESULT" = failure ] && [ "$STATUS" != passed ]; then
            state="not measured" width=138 top="#959DA5" bottom="#6A737D" right="81.939C83.629 0 85 1.343 85"
          fi
          cat > "$RUNNER_TEMP/badge.svg" <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="$width" height="20">
            <title>Duel - $state</title>
            <defs>
              <linearGradient id="duel-fill" x1="50%" y1="0%" x2="50%" y2="100%">
                <stop stop-color="#444D56" offset="0%"></stop>
                <stop stop-color="#24292E" offset="100%"></stop>
              </linearGradient>
              <linearGradient id="state-fill" x1="50%" y1="0%" x2="50%" y2="100%">
                <stop stop-color="$top" offset="0%"></stop>
                <stop stop-color="$bottom" offset="100%"></stop>
              </linearGradient>
            </defs>
            <g fill="none" fill-rule="evenodd">
              <g font-family="'DejaVu Sans',Verdana,Geneva,sans-serif" font-size="11">
                <path d="M0,3 C0,1.3431 1.3552,0 3.02702703,0 L53,0 L53,20 L3.02702703,20 C1.3552,20 0,18.6569 0,17 L0,3 Z" fill="url(#duel-fill)" fill-rule="nonzero"></path>
                <text fill="#010101" fill-opacity=".3">
                  <tspan x="22.1981982" y="15" aria-hidden="true">Duel</tspan>
                </text>
                <text fill="#FFFFFF">
                  <tspan x="22.1981982" y="14">Duel</tspan>
                </text>
              </g>
              <g transform="translate(53)" font-family="'DejaVu Sans',Verdana,Geneva,sans-serif" font-size="11">
                <path d="M0 0h$right 3v14c0 1.657-1.37 3-3.061 3H0V0z" fill="url(#state-fill)" fill-rule="nonzero"></path>
                <text fill="#010101" fill-opacity=".3" aria-hidden="true">
                  <tspan x="4" y="15">$state</tspan>
                </text>
                <text fill="#FFFFFF">
                  <tspan x="4" y="14">$state</tspan>
                </text>
              </g>
              <g fill="#959DA5">
                <path d="M4.6 3.6L6.9 4.5L14.3 11.9L12.9 13.3L5.5 5.9Z M17.4 3.6L15.1 4.5L7.7 11.9L9.1 13.3L16.5 5.9Z"></path>
                <circle cx="16.6" cy="15.6" r="1.1"></circle>
                <circle cx="5.4" cy="15.6" r="1.1"></circle>
              </g>
              <g stroke="#959DA5" stroke-linecap="round">
                <path d="M12.1 14.5L15.5 11.1 M9.9 14.5L6.5 11.1" stroke-width="1.6"></path>
                <path d="M13.8 12.8L16 15 M8.2 12.8L6 15" stroke-width="1.8"></path>
              </g>
            </g>
          </svg>
          SVG
          tree=$(jq -n --rawfile svg "$RUNNER_TEMP/badge.svg" '{tree: [{path: "badge.svg", mode: "100644", type: "blob", content: $svg}]}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq .sha)
          commit=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" -f message="Duel's badge, for $GITHUB_SHA" -f tree="$tree" --jq .sha)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f sha="$commit" -F force=true > /dev/null 2>&1 ||
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$commit" > /dev/null || blocked
