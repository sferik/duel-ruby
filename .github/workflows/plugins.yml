name: Plugins

# Every plugin's tests, against Duel as it is here. A plugin's own
# workflow (plugin-*.yml) runs only when its directory changes, so this
# one catches a change to Duel that breaks a plugin. It runs when Duel's
# code changes (what the gem ships, and its bundle), and only the tests,
# on one Ruby: the plugins' workflows do the rest.
on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "sig/**"
      - "exe/**"
      - "duel.gemspec"
      - "Gemfile"
      - ".github/workflows/plugins.yml"
  pull_request:
    paths:
      - "lib/**"
      - "sig/**"
      - "exe/**"
      - "duel.gemspec"
      - "Gemfile"
      - ".github/workflows/plugins.yml"
  # By hand (Actions > Plugins > Run workflow): to check the plugins
  # against Duel whatever changed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # (Linux's named for the plugin alone, as they were.)
    name: ${{ matrix.os == 'ubuntu-latest' && matrix.plugin || format('{0} ({1})', matrix.plugin, matrix.os) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        plugin: [activerecord, gvl, memcached, mysql, postgresql, rails, redis, retained]
        # What each plugin's tests need installed, as its own workflow
        # installs it (gvl's extension: `rake test` builds it): on Linux
        # with apt, on macOS with Homebrew. Windows's runners have
        # PostgreSQL and MySQL already, and Redis and memcached are
        # downloaded (see below).
        include:
          - plugin: memcached
            packages: memcached
            brew: memcached
          - plugin: mysql
            packages: mysql-server
            brew: mysql
          - plugin: postgresql
            # PostgreSQL (its programs in /usr/lib/postgresql/*/bin, where
            # the plugin looks), with pg_stat_statements, and libpq's
            # headers for pg.
            packages: postgresql libpq-dev
            brew: postgresql@17
          - plugin: redis
            packages: redis-server
            brew: redis
    # macOS's and Windows's are advisory until they pass there: the
    # plugins that start servers find and stop them the Unix way.
    env:
      ADVISORY: ${{ matrix.os != 'ubuntu-latest' }}
    # The plugin is a project of its own, in its directory: its Gemfile
    # (which takes Duel from ../..), Rakefile and tests.
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.packages && runner.os == 'Linux'
        run: sudo apt-get install -y ${{ matrix.packages }}
      # AppArmor confines Ubuntu's mysqld to /var/lib/mysql. Each worker's
      # server keeps its data in a directory of its own, under /tmp.
      - if: matrix.plugin == 'mysql' && runner.os == 'Linux'
        run: |
          if [ -f /etc/apparmor.d/usr.sbin.mysqld ]; then
            sudo ln -sf /etc/apparmor.d/usr.sbin.mysqld /etc/apparmor.d/disable/
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld
          fi
      # (Homebrew's PostgreSQL isn't linked onto the PATH, where the
      # plugin looks.)
      - if: matrix.brew && runner.os == 'macOS'
        run: |
          brew install ${{ matrix.brew }}
          echo "$(brew --prefix ${{ matrix.brew }})/bin" >> "$GITHUB_PATH"
      # Windows has no Redis or memcached of its own: these are builds of
      # them for Windows, pinned: Redis's by MSYS2, checked against its
      # digest, and memcached's by Cygwin (1.6.45, with the DLLs it needs:
      # Dalli's meta protocol wants a recent one), each file at a commit of
      # the repository that holds it, checked against its digest. The plugins use them over TCP there
      # (their tcp: option).
      - if: matrix.plugin == 'redis' && runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/redis.zip" https://github.com/redis-windows/redis-windows/releases/download/8.10.3/Redis-8.10.3-Windows-x64-msys2.zip
          echo "af16df340525b431e9ec8dabfd625d5e7a233f82805b5418819904ea909c447f  $RUNNER_TEMP/redis.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/redis.zip" -d "$RUNNER_TEMP/redis"
          server=$(find "$RUNNER_TEMP/redis" -name redis-server.exe | head -1)
          cygpath -w "$(dirname "$server")" >> "$GITHUB_PATH"
      - if: matrix.plugin == 'memcached' && runner.os == 'Windows'
        shell: bash
        run: |
          dir="$RUNNER_TEMP/memcached"
          mkdir -p "$dir"
          cd "$dir"
          while read -r sum file; do
            curl -fsSL -o "$file" "https://raw.githubusercontent.com/nono303/memcached/e78f75a8f8606409a090a1a88a682a1f9be47c20/libevent-2.1/x64/$file"
            echo "$sum  $file" | sha256sum -c -
          done <<SUMS
          e40a3fc08942808e409aa011cfe8ab02ffd44c5ed3ba458f81affaf3544343fd memcached.exe
          554e30a21a5c4ad1a78cd9b2b286ce48fa2356da87f6d6f35e34bce701e70be0 cygwin1.dll
          7cd354d0efce2ff1f463c47a8eb9996629fc9889ea51f389f45f2a210e703b4f cygevent-2-1-7.dll
          04b8b2b8cf9a99913c0a589dbdf90eb6aa79c40195dc94e095e11f79fbb0a6bd cygevent_core-2-1-7.dll
          597ce8e1db4b444ea1d4ccb8edeb7d47f336fa60581a1cd7a2a81e8f01d96ed2 cygevent_extra-2-1-7.dll
          0e42f7bff84024321c0ff688898d64406c1d8acaca5fbf4d7388b221b34833b0 cygevent_pthreads-2-1-7.dll
          f42d73d96c69f731d01eba662d5c21e8fdde103c692385e6e23f69c2b0bfa494 cygevent_openssl-2-1-7.dll
          10a7bd9046915bd1729233426e38e129e6e25ba538ffbf6ca66d9dd71fd5d9dc cygz.dll
          ea44808fdc52f7cf2a4d817fc5103a12c91df48eb0b0dd05cab1b8a8490fa95c cygcrypto-3.dll
          e375b780d90333bd9cb072c988b65a403fb72095d9b00c4233536926fc6ba07b cygssl-3.dll
          SUMS
          cygpath -w "$dir" >> "$GITHUB_PATH"
      # (Windows's runners have PostgreSQL in PGBIN, off the PATH.)
      - if: matrix.plugin == 'postgresql' && runner.os == 'Windows'
        shell: bash
        run: echo "$PGBIN" >> "$GITHUB_PATH"
      # (A bundle cached for each plugin's directory.)
      - id: ruby
        uses: ruby/setup-ruby@v1
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: plugins/${{ matrix.plugin }}
      - name: Run tests
        id: tests
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        env:
          COVERAGE: "false"
        run: bundle exec rake test
      - name: Note an advisory failure
        if: steps.ruby.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: echo "::warning title=${{ matrix.plugin }} on ${{ matrix.os }} (advisory)::A step failed for ${{ matrix.plugin }} on ${{ matrix.os }}, which its tests don't pass on yet"
