name: Perf

on:
  pull_request:
    paths-ignore:
      - "plugins/**"
      - ".github/workflows/plugin-*.yml"
  push:
    branches: [main]
    # The plugins (plugins/*) have workflows of their own (plugin-*.yml).
    paths-ignore:
      - "plugins/**"
      - ".github/workflows/plugin-*.yml"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duel:
    name: Duel
    runs-on: ubuntu-latest
    # The run's status (passed, failed or neutral), for the badge.
    outputs:
      status: ${{ steps.compare.outputs.status }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the baseline comes from history, tags included
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      # Against the main branch for a pull request, what was there before
      # for a push, and the last release on a schedule (slow creep).
      - name: Compare
        id: compare
        env:
          DUEL_BASE: ${{ github.event_name == 'schedule' && 'last-release' || github.event_name == 'push' && github.event.before || '' }}
          # (Run by hand, it compares anyway: with nothing changed, the code
          # with itself, which checks the setup.)
          DUEL_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          # (A branch's first push, or one that rewrote history, has no
          # commit before it here to compare against.)
          if [ "$GITHUB_EVENT_NAME" = push ] && ! git cat-file -e "$DUEL_BASE^{commit}" 2>/dev/null; then
            echo "::notice::No commit before this push to compare against"
            exit 0
          fi
          bundle exec duel

  # Duel's badge, in README.md: green (perf guarded) or red (perf
  # regressed), as the last push to main that Duel compared left it.
  # This job writes it, alone, to a branch of its own, duel/badge, and
  # checks nothing out (see docs/ci.md, Show whether the last push
  # passed).
  badge:
    name: Update the badge
    needs: duel
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && (needs.duel.result == 'failure' || needs.duel.outputs.status == 'passed' || needs.duel.outputs.status == 'failed') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # to move the badge's branch
    steps:
      - name: Update the badge
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: duel/badge
          RESULT: ${{ needs.duel.result }}
          STATUS: ${{ needs.duel.outputs.status }}
          BADGES: https://raw.githubusercontent.com/sferik/duel-ruby/main/assets
        run: |
          # (Where the badge is a newer push's, that push's run has the say.
          # Its commit names the push.)
          last=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .commit.message 2>/dev/null | sed -n 's/^Duel.s badge, for \([0-9a-f]*\)$/\1/p') || true
          if [ -n "$last" ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$last" --jq .status 2>/dev/null)" = ahead ]; then exit 0; fi
          badge="badge.svg"
          if [ "$RESULT" = failure ] || [ "$STATUS" = failed ]; then badge="badge-regressed.svg"; fi
          curl -fsSL "$BADGES/$badge" -o "$RUNNER_TEMP/badge.svg"
          tree=$(jq -n --rawfile svg "$RUNNER_TEMP/badge.svg" '{tree: [{path: "badge.svg", mode: "100644", type: "blob", content: $svg}]}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq .sha)
          commit=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" -f message="Duel's badge, for $GITHUB_SHA" -f tree="$tree" --jq .sha)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f sha="$commit" -F force=true > /dev/null 2>&1 ||
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$commit" > /dev/null
