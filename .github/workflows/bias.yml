name: Bias

# Nightly, and on a pull request that changes how Duel measures or
# judges, Duel compares identical code: the main branch (or the pull
# request) with itself, several times over (tasks/bias_check.rb). Duel
# is only worth trusting if identical code compares even, so a run that
# finds a regression fails the check, as do intervals that leave out 1
# (the ratio of identical code) more often than their confidence allows,
# and the summary of every benchmark's ratio across the runs shows a
# lean (one side faster every time) that no one run calls. Duel's own
# benchmarks, on CRuby and on JRuby (whose JIT makes each worker
# different), and duel-redis's, whose workers each start a server.
on:
  pull_request:
    paths:
      - lib/duel/across.rb
      - lib/duel/runner.rb
      - lib/duel/stats.rb
      - lib/duel/worker.rb
      - tasks/bias_check.rb
      - .github/workflows/bias.yml
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aa:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120 # (JRuby's warm-ups take a while)
    strategy:
      fail-fast: false
      matrix:
        include:
          # On the Ruby each one's Perf comparison uses.
          - name: Duel
            directory: "."
            ruby-version: "4.0"
            runs: 10
          - name: Duel on JRuby
            directory: "."
            ruby-version: jruby-10.0
            runs: 3
          - name: duel-redis
            directory: plugins/redis
            ruby-version: "3.4"
            runs: 5
            packages: redis-server
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      # (The baseline is HEAD, so no history is needed.)
      - uses: actions/checkout@v7
      - if: matrix.packages
        run: sudo apt-get install -y ${{ matrix.packages }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          working-directory: ${{ matrix.directory }}
      - name: Compare identical code ${{ matrix.runs }} times
        run: ruby "$GITHUB_WORKSPACE/tasks/bias_check.rb" ${{ matrix.runs }}
