name: Test

on:
  push:
    branches: [main]
    # The plugins (plugins/*) have workflows of their own (plugin-*.yml).
    paths-ignore:
      - "plugins/**"
      - ".github/workflows/plugin-*.yml"
  pull_request:
    paths-ignore:
      - "plugins/**"
      - ".github/workflows/plugin-*.yml"
  # Nightly, TruffleRuby's tests (see the test job's matrix) only.
  schedule:
    - cron: "30 4 * * *"
  # By hand (Actions > Test > Run workflow): a push GitHub can't diff (a
  # force-pushed root commit, say) matches no paths, so starts nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.ruby-version }}
    runs-on: ubuntu-latest
    # A hang fails the job, rather than running for GitHub's six hours
    timeout-minutes: 45
    # The development versions (Ruby's, JRuby's and TruffleRuby's) get an
    # early look, but can't fail the build.
    strategy:
      fail-fast: false
      matrix:
        # The slowest first, so they start before the rest of the queue
        # TruffleRuby's, the slowest, run nightly (on the schedule), alone:
        # a push or pull request waits for the rest only.
        ruby-version: ${{ fromJSON(github.event_name == 'schedule' && '["truffleruby-head"]' || '["jruby-10.0", "jruby-10.1", "jruby-head", "3.4", "4.0", "ruby-head"]') }}
    steps:
      - uses: actions/checkout@v7
      - id: ruby
        uses: ruby/setup-ruby@v1
        continue-on-error: ${{ endsWith(matrix.ruby-version, '-head') }}
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      # A development version's failure is advisory: the step's failure
      # shows, but the job (and its check) passes, with a warning.
      # The test files in 3 processes at once, given files by the time
      # they took (test/parallel_runtime.log), so that they finish about
      # together, with coverage off (the Coverage job checks it).
      - name: Run tests
        id: tests
        continue-on-error: ${{ endsWith(matrix.ruby-version, '-head') }}
        env:
          # JRuby's --dev starts each process faster, and the tests start many
          JRUBY_OPTS: ${{ startsWith(matrix.ruby-version, 'jruby') && '--dev' || '' }}
        run: bundle exec rake test:parallel
      - name: Note an advisory failure
        if: steps.ruby.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: echo "::warning title=${{ matrix.ruby-version }} (advisory)::A step failed on ${{ matrix.ruby-version }}, a development version"

  # The tests on macOS and Windows, on the latest CRuby, and on macOS on
  # JRuby 10.0 and 10.1 too. Windows's are advisory until they pass
  # there, as are JRuby's on macOS, new here.
  os:
    # (CRuby's named for the system alone, as they were.)
    name: ${{ matrix.ruby-version == '4.0' && matrix.os || format('{0} {1}', matrix.os, matrix.ruby-version) }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        ruby-version: ["4.0", "jruby-10.0", "jruby-10.1"]
        # (Not JRuby on Windows yet: its spawn splits an argument at its
        # spaces there, and its workers hang. CRuby's is Windows's.)
        exclude:
          - os: windows-latest
            ruby-version: jruby-10.0
          - os: windows-latest
            ruby-version: jruby-10.1
    env:
      ADVISORY: ${{ matrix.os == 'windows-latest' || startsWith(matrix.ruby-version, 'jruby') }}
    steps:
      - uses: actions/checkout@v7
      - id: ruby
        uses: ruby/setup-ruby@v1
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      # (On Windows, in one process, each test named as it runs, so that
      # one that hangs shows which, until they pass there. Elsewhere, the
      # skipped tests are named, as what a system can't measure shows
      # there.)
      - name: Run tests
        id: tests
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        env:
          COVERAGE: "false"
          TESTOPTS: ${{ matrix.os == 'windows-latest' && '-v' || '--show-skips' }}
          # JRuby's --dev starts each process faster, and the tests start many
          JRUBY_OPTS: ${{ startsWith(matrix.ruby-version, 'jruby') && '--dev' || '' }}
        run: bundle exec rake ${{ matrix.os == 'windows-latest' && 'test' || 'test:parallel' }}
      - name: Note an advisory failure
        if: steps.ruby.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: echo "::warning title=${{ matrix.os }} ${{ matrix.ruby-version }} (advisory)::A step failed on ${{ matrix.os }}, ${{ matrix.ruby-version }}, which Duel's tests don't pass on yet"

  coverage:
    name: Coverage (100% line, branch and method)
    # (Nightly, only TruffleRuby's tests run.)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # SimpleCov's strict profile fails the run if any criterion drops
      # below 100%.
      - run: bundle exec rake test
