name: Probe

on:
  push:
    branches: [probe/windows-exit]

permissions:
  contents: read

jobs:
  exit:
    name: ${{ matrix.ruby-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.4", "4.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - run: ruby probe/exit.rb
